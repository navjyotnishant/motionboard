    <style>

    <script src="js/config.js"></script>
    <script>
      (function () {
        var C = window.MB, T = C.theme || {}, W = C.width, H = C.height, S = Math.min(W, H) / 1080;
        var base = H - 506 * S;
        function put(id, txt, top, css) { var e = document.getElementById(id); e.textContent = txt || ""; e.style.cssText += "top:" + top + "px;" + css; }
        put("artist", T.artist, base, "font:500 " + 112 * S + "px CG;letter-spacing:" + 30 * S + "px;padding-left:" + 30 * S + "px;color:#f3ece0;text-shadow:0 0 26px rgba(255,214,150,.45),0 2px 18px rgba(0,0,0,.9)");

        if (!T.artist) r.style.display = "none";
        put("song", T.song, base + 148 * S, "font:italic 400 " + 84 * S + "px CG;color:#eccc96;text-shadow:0 0 22px rgba(255,214,150,.4),0 2px 16px rgba(0,0,0,.9)");

        g.globalCompositeOperation = "lighter";
        for (var i = 0; i < 260; i++) {
          var h = hash(i * 3.1), k = hash(i * 7.7), m = hash(i * 1.9);
          var x = W / 2 - 400 * S + h * 800 * S + (k - 0.5) * 120 * S, y = base - 54 * S + k * 420 * S + (m - 0.5) * 60 * S;
          var a = 0.15 + 0.6 * m * m, rr = (1 + m * 2.2) * S;
          g.fillStyle = "rgba(255," + (196 + Math.floor(h * 50)) + "," + (130 + Math.floor(k * 70)) + "," + a.toFixed(3) + ")";
          g.fillRect(x - rr / 2, y - rr / 2, rr, rr);
        }
        window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["main"] = document.fonts.ready.then(function () {
