name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine
    env:
      MB_BACKEND: stub
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check src tests
      - name: Test (stub backend, no GPU, no weights)
        run: uv run pytest -q
