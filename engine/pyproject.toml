[project]
name = "motionboard"
version = "0.1.0"
description = "Motionboard engine: storyboard first music videos on your own machine"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "librosa>=0.10",
    "soundfile>=0.12",
    "psutil>=5.9",
    "pillow>=10.3",
]

[project.optional-dependencies]
align = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
vocals = ["demucs>=4.0"]

[project.scripts]
mb = "motionboard.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motionboard"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs the real video backend and model weights",
    "slow: takes more than a few seconds",
]
addopts = "-m 'not gpu'"
